# 商盟系统 · 生产编排：MySQL + server(NestJS) + gateway(Nginx 含前端) [+ screen 仅构建/独立运行]
#
# 使用：
#   cp .env.example .env
#   docker compose build screen        # 可选：构建独立前端镜像（不参与运行时）
#   docker compose up -d --build       # 构建并启动 mysql / server / gateway
#   访问：http://localhost（网关）  http://localhost/api/docs（Swagger）
#
# 仅本地起数据库做开发：
#   docker compose up -d mysql
#
# 依赖链：
#   mysql(healthy) → server(healthy) → gateway
#   gateway 镜像自带前端产物（多阶段构建），不依赖共享卷

services:
  # ---------------------------------------------------------------- 数据库
  mysql:
    image: mysql:8.0
    container_name: shangmeng-mysql
    restart: unless-stopped
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shangmeng}
      MYSQL_USER: ${MYSQL_USER:-shangmeng}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shangmeng}
      TZ: ${TZ:-Asia/Shanghai}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [shangmeng]

  # ---------------------------------------------------------------- 后端服务
  server:
    container_name: shangmeng-server
    build:
      context: .
      dockerfile: server/Dockerfile
    image: shangmeng-server:${TAG:-latest}
    restart: unless-stopped
    # 生产不直接暴露，统一走网关；调试时打开下面两行
    # ports:
    #   - '${SERVER_PORT:-3000}:3000'
    environment:
      # 默认 production（安全优先）：NODE_ENV=production 时自动关闭 Swagger /api/docs。
      # 本地开发请在 .env 里显式写 NODE_ENV=development 打开它。
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${SERVER_PORT:-3000}
      API_PREFIX: ${API_PREFIX:-api/v1}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # 仅用于外部系统对接（SSE publish / stats / 临时调试令牌）
      API_TOKEN: ${API_TOKEN}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SSE_HEARTBEAT_MS: ${SSE_HEARTBEAT_MS:-30000}
      SSE_TICKET_TTL_MS: ${SSE_TICKET_TTL_MS:-60000}
      TZ: ${TZ:-Asia/Shanghai}
      # MVP 上传落本地磁盘；后续换 OSS 时改 UploadService 实现即可
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    volumes:
      # 宿主机 ./uploads 持久化，容器重建不丢营业执照
      - ./uploads:/app/uploads
      # 挂载 migrations：容器里跑 prisma migrate dev 生成的新迁移直接落到宿主仓库，
      # 不用再 docker compose cp 拷贝（见 docs/05 排错表）。仓库始终持有迁移，重建镜像不会丢。
      - ./server/prisma/migrations:/app/server/prisma/migrations
      # 挂载 seed.ts：让容器内重新 seed 使用宿主最新权限定义（如 report:view/export），无需重建镜像
      - ./server/prisma/seed.ts:/app/server/prisma/seed.ts
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:${SERVER_PORT:-3000}/api/v1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [shangmeng]

  # ---------------------------------------------------------------- 网关（Nginx + 前端静态资源）
  gateway:
    container_name: shangmeng-gateway
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
    image: shangmeng-gateway:${TAG:-latest}
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-80}:80'
    volumes:
      - nginx-logs:/var/log/nginx
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [shangmeng]

  # ---------------------------------------------------------------- 前端独立镜像（screen）
  # 默认不启动（profiles），仅用于：① 单独静态托管 ② 发布到对象存储 ③ 本地独立验证
  #   docker compose build screen
  #   docker compose --profile assets up -d screen   → http://localhost:8080
  screen:
    container_name: shangmeng-screen
    profiles: ['assets']
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
    image: shangmeng-screen:${TAG:-latest}
    restart: unless-stopped
    ports:
      - '${SCREEN_PORT:-8080}:80'
    networks: [shangmeng]

volumes:
  mysql-data:
  nginx-logs:

networks:
  shangmeng:
    driver: bridge
