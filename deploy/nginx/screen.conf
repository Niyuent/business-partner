# 前端镜像内置 Nginx 配置（screen 单独运行 docker run -p 8080:80 时使用）
# 网关场景由 deploy/nginx/gateway.conf 托管静态资源，本文件不生效

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_http_version 1.1;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml font/woff font/woff2;

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
