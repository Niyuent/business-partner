# 商盟系统 · 网关 Nginx 配置
# 职责：托管前端静态资源（SPA 回退）+ /api/ 反向代理 + SSE 长连接 + gzip
# 挂载位置：/etc/nginx/conf.d/default.conf

upstream shangmeng_api {
    server server:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 脱敏日志格式：ticket / token / access_token / password 参数值替换为 ***
# 注意：官方 nginx.conf 已定义名为 main 的 log_format，这里必须用不同名字
log_format shangmeng '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri$log_q $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------ 查询串脱敏（供 access_log 使用）
    set $log_query $args;
    if ($log_query ~* "^(.*)ticket=([^&]*)(.*)$")        { set $log_query "$1ticket=***$3"; }
    if ($log_query ~* "^(.*)token=([^&]*)(.*)$")         { set $log_query "$1token=***$3"; }
    if ($log_query ~* "^(.*)access_token=([^&]*)(.*)$")  { set $log_query "$1access_token=***$3"; }
    if ($log_query ~* "^(.*)password=([^&]*)(.*)$")      { set $log_query "$1password=***$3"; }
    set $log_q "";
    if ($log_query != "") { set $log_q "?$log_query"; }

    # ------------------------------------------------------------ 基础
    server_tokens off;
    client_max_body_size 20m;          # 营业执照 / 门店图片上传
    client_body_timeout 60s;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ------------------------------------------------------------ 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/access.log shangmeng;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------ gzip 静态资源
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2
        application/vnd.ms-fontobject;
    # 注意：不包含 text/event-stream —— SSE 绝不压缩（会破坏实时性）

    # ------------------------------------------------------------ SSE：必须关闭缓冲
    # 路径：/api/v1/sse/notifications?ticket=xxx
    location /api/v1/sse/ {
        proxy_pass http://shangmeng_api;
        proxy_http_version 1.1;

        # 长连接关键配置
        proxy_buffering off;           # 关闭响应缓冲，事件即时下发
        proxy_cache off;               # 关闭缓存
        proxy_request_buffering off;
        chunked_transfer_encoding on;  # 保持分块传输
        proxy_read_timeout 3600s;      # 读取超时拉长到 1 小时
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Buffering no;

        gzip off;                      # SSE 绝不压缩
        # 上游 NestJS 也会发一份 Cache-Control，隐掉避免响应头重复
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-transform" always;

        # SSE 连接频繁，避免日志刷屏（且 ticket 出现在 URL 中）
        access_log off;
    }

    # ------------------------------------------------------------ 上传文件（营业执照/门店图片）
    # 静态资源由后端托管在 ./uploads/，MVP 落本地磁盘；后续换 OSS 时改为指向 OSS
    location /uploads/ {
        proxy_pass http://shangmeng_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ------------------------------------------------------------ 普通 API 反向代理
    location /api/ {
        proxy_pass http://shangmeng_api;
        proxy_http_version 1.1;

        # 如需 WebSocket：在 http 块添加 map $http_upgrade $connection_upgrade 后再放开
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }

    # ------------------------------------------------------------ 带 hash 的构建产物：长缓存
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    # ------------------------------------------------------------ 入口文件：禁用缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ------------------------------------------------------------ SPA 回退（vue-router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------ 错误页
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
